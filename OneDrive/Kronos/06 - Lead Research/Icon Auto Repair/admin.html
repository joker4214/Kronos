<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login | Icon Auto Repair & Collision</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner container">
    <a href="index.html" class="brand">
      <img class="brand-logo" src="https://i.postimg.cc/VLM8R2Xr/unnamed.jpg" alt="Icon Auto Repair & Collision logo">
      <span class="brand-text">
        <span class="b1" style="display:block;">ICON AUTO REPAIR</span>
        <span class="b2">&amp; COLLISION</span>
      </span>
    </a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="status.html">Check Status</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-cta">
      <a href="tel:+12484294897" class="header-phone"><span>&#9742;</span> (248) 429-4897</a>
      <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
    </div>
  </div>
</header>

<div class="page-header">
  <div class="container">
    <h1>Staff Dashboard</h1>
    <p>Manager login &mdash; update vehicle status in real time.</p>
  </div>
</div>

<section>
  <div class="container">

    <!-- LOGIN VIEW -->
    <div id="loginView">
      <div class="login-box">
        <h2 style="text-align:center; margin-bottom:0;">Manager Login</h2>
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password">
        <button class="btn btn-primary" onclick="login()">Log In</button>
        <div class="login-error" id="loginError">Incorrect username or password.</div>
      </div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" style="display:none;">
      <div class="admin-toolbar">
        <h2 style="margin:0;">Vehicles</h2>
        <button class="btn btn-dark" onclick="logout()">Log Out</button>
      </div>

      <div class="add-car-form">
        <input type="text" id="newMake" placeholder="Make">
        <input type="text" id="newModel" placeholder="Model">
        <input type="text" id="newPlate" placeholder="Plate (3 chars)" maxlength="3">
        <input type="text" id="newMechanic" placeholder="Mechanic">
        <button class="btn btn-primary" onclick="addCar()">+ Add Vehicle</button>
      </div>

      <table class="admin-table">
        <thead>
          <tr>
            <th>Vehicle</th>
            <th>Plate</th>
            <th>Mechanic</th>
            <th>Status</th>
            <th>Updated</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="carRows"></tbody>
      </table>
    </div>

  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const STATUSES = ['Inspection', 'Waiting on Part', 'In Repair', 'Final Stretch', 'Complete'];

function getToken() { return localStorage.getItem('iconauto_session'); }
function setToken(t) { localStorage.setItem('iconauto_session', t); }
function clearToken() { localStorage.removeItem('iconauto_session'); }

async function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const { data, error } = await supabaseClient.rpc('manager_login', { p_username: username, p_password: password });

  if (error || !data) {
    document.getElementById('loginError').style.display = 'block';
    return;
  }
  setToken(data);
  showDashboard();
}

function logout() {
  clearToken();
  document.getElementById('dashboardView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
}

async function checkSession() {
  const token = getToken();
  if (!token) return false;
  const { data } = await supabaseClient.rpc('is_valid_session', { p_token: token });
  return !!data;
}

async function showDashboard() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('dashboardView').style.display = 'block';
  await loadCars();
}

async function loadCars() {
  const { data, error } = await supabaseClient.from('cars').select('*').order('updated_at', { ascending: false });
  if (error) return;
  const rows = data.map(car => {
    const options = STATUSES.map(s => `<option value="${s}" ${s === car.status ? 'selected' : ''}>${s}</option>`).join('');
    return `
      <tr data-id="${car.id}">
        <td>${car.make} ${car.model}</td>
        <td>${car.plate3}</td>
        <td><input type="text" value="${car.mechanic || ''}" data-field="mechanic"></td>
        <td><select data-field="status">${options}</select></td>
        <td style="font-size:12px; color:#888;">${new Date(car.updated_at).toLocaleString()}</td>
        <td style="white-space:nowrap;">
          <button class="btn btn-primary" style="padding:8px 14px; font-size:12px;" onclick="saveCar('${car.id}', this)">Save</button>
          <span class="save-msg">Saved</span>
          <button class="btn btn-dark" style="padding:8px 14px; font-size:12px;" onclick="removeCar('${car.id}')">Delete</button>
        </td>
      </tr>
    `;
  }).join('');
  document.getElementById('carRows').innerHTML = rows || '<tr><td colspan="6" style="text-align:center; color:#888;">No vehicles yet.</td></tr>';
}

async function saveCar(id, btn) {
  const row = btn.closest('tr');
  const mechanic = row.querySelector('[data-field="mechanic"]').value;
  const status = row.querySelector('[data-field="status"]').value;
  const token = getToken();

  const { data, error } = await supabaseClient.rpc('update_car_status', {
    p_token: token, p_car_id: id, p_status: status, p_mechanic: mechanic
  });

  if (!error && data) {
    const msg = row.querySelector('.save-msg');
    msg.style.display = 'inline';
    setTimeout(() => msg.style.display = 'none', 1500);
  }
}

async function removeCar(id) {
  if (!confirm('Remove this vehicle from the status board?')) return;
  const token = getToken();
  await supabaseClient.rpc('delete_car', { p_token: token, p_car_id: id });
  loadCars();
}

async function addCar() {
  const make = document.getElementById('newMake').value.trim();
  const model = document.getElementById('newModel').value.trim();
  const plate = document.getElementById('newPlate').value.trim();
  const mechanic = document.getElementById('newMechanic').value.trim();
  if (!make || !model || !plate) { alert('Make, model, and plate are required.'); return; }

  const token = getToken();
  const { error } = await supabaseClient.rpc('add_car', {
    p_token: token, p_make: make, p_model: model, p_plate3: plate, p_mechanic: mechanic, p_status: 'Inspection'
  });

  if (!error) {
    document.getElementById('newMake').value = '';
    document.getElementById('newModel').value = '';
    document.getElementById('newPlate').value = '';
    document.getElementById('newMechanic').value = '';
    loadCars();
  }
}

(async function init() {
  if (await checkSession()) {
    showDashboard();
  }
})();
</script>
</body>
</html>
